{# One kanban column. Used inside board.html and as an HTMX partial. #}
<div class="kanban-column brand-card p-3 w-72 shrink-0 flex flex-col">
  <div class="bg-brand-lighter px-3 py-2 -m-3 mb-3 rounded-t-lg border-b border-brand-light flex items-center justify-between">
    <h2 class="text-sm font-semibold text-brand-navy uppercase tracking-wide flex items-center">
      {{ column.name }}
      <span data-column-count="{{ column.pk }}"
            class="ml-2 text-xs bg-brand-navy/10 text-brand-navy px-2 py-0.5 rounded-full">{{ column.tasks.count }}</span>
    </h2>
    {% if is_project_manager %}
    <button class="btn btn-ghost btn-xs text-brand-navy"
            hx-get="{% url 'tasks:create' project_pk=project.pk %}?container={{ column.pk }}"
            hx-target="#task-modal-body"
            hx-swap="innerHTML"
            onclick="document.getElementById('task-modal').showModal()"
            title="Add task to this column"
            aria-label="Add task to this column">
      +
    </button>
    {% endif %}
  </div>

  <ul id="column-{{ column.pk }}"
      data-column-id="{{ column.pk }}"
      class="kanban-column-list flex flex-col min-h-[4rem] flex-1">
    {% for task in column.tasks.all %}
      {% include "tasks/task_card.html" with task=task %}
    {% endfor %}
  </ul>
</div>
