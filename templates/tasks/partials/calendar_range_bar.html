{# Single range-bar chip, positioned by the caller's grid-cols-7 lane row via col-start-N/col-end-N. #}
{# Expects `bar` ({task, start_col, end_col, is_range_start, is_range_end}) and `project` in context. #}
<div class="col-start-{{ bar.start_col }} col-end-{{ bar.end_col|add:"1" }} h-5 flex items-center px-1.5 text-[10px] text-white truncate cursor-pointer bg-brand-navy hover:bg-brand-navy/90 transition-colors
            {% if bar.is_range_start %}rounded-l-md{% endif %}
            {% if bar.is_range_end %}rounded-r-md{% endif %}
            {% if bar.task.is_priority %} ring-1 ring-inset ring-error{% endif %}"
     title="{{ bar.task.name }} ({{ bar.task.start_date|date:'M j' }} – {{ bar.task.deadline|date:'M j' }})"
     @click="$dispatch('open-task-pane', { url: '{% url "tasks:detail_pane" project_pk=project.pk pk=bar.task.pk %}' })">
  <span class="truncate">{{ bar.task.name }}</span>
</div>
