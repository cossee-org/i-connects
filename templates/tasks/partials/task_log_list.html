{% comment %}
  Activity timeline. Self-refreshes via HTMX when an
  ``assignees-changed`` event fires on the body.
{% endcomment %}
<div id="task-log-list" class="flex flex-col gap-3"
     hx-get="{% url 'tasks:activity' pk=task.pk %}"
     hx-trigger="assignees-changed from:body"
     hx-swap="outerHTML">
  {% for activity in task_activities %}
    {% include "tasks/partials/task_activity_item.html" with activity=activity %}
  {% empty %}
    <p class="text-sm text-brand-text/60">No activity yet.</p>
  {% endfor %}
</div>
