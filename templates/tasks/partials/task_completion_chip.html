{# Complete / Not Complete chip. Pass oob=True to re-render it out of band alongside a #task-status-block swap. #}
<span id="task-completion-chip"{% if oob %} hx-swap-oob="true"{% endif %}
      class="inline-flex items-center gap-1.5 text-xs font-medium {% if task.status == 'COMPLETED' %}text-success{% else %}text-brand-text/70{% endif %}">
  {% if task.status == "COMPLETED" %}
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" class="w-3.5 h-3.5 shrink-0" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm4.7-9.3a1 1 0 0 0-1.4-1.4L9 11.6 6.7 9.3a1 1 0 0 0-1.4 1.4l3 3a1 1 0 0 0 1.4 0l5-5Z" clip-rule="evenodd" />
    </svg>
    <span>Complete</span>
  {% else %}
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <circle cx="10" cy="10" r="7.5" />
    </svg>
    <span>Not Complete</span>
  {% endif %}
</span>
