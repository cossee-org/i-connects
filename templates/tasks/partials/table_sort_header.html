{# One sortable <th> for the Table view — {% include "tasks/partials/table_sort_header.html" with key="name" label="Task" %}. #}
{# Clicking sorts by this header, ascending first; clicking the active header flips the direction. #}
<th scope="col"
    {% if table_sort_key == key %}aria-sort="{% if table_sort_desc %}descending{% else %}ascending{% endif %}"{% endif %}
    class="{{ extra_class }}">
  <button type="button"
          class="inline-flex items-center gap-1 font-semibold hover:text-brand-coral transition-colors"
          hx-get="{% url 'tasks:board_table' project_pk=project.pk %}?table_sort={% if table_sort_key == key and not table_sort_desc %}-{% endif %}{{ key }}"
          hx-target="#table-view-container" hx-swap="innerHTML">
    {{ label }}
    {% if table_sort_key == key %}
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3.5 h-3.5 shrink-0{% if table_sort_desc %} rotate-180{% endif %}" aria-hidden="true">
        <path fill-rule="evenodd" d="M10 17a.75.75 0 0 1-.75-.75V5.612L5.29 9.77a.75.75 0 0 1-1.08-1.04l5.25-5.5a.75.75 0 0 1 1.08 0l5.25 5.5a.75.75 0 1 1-1.08 1.04l-3.96-4.158V16.25A.75.75 0 0 1 10 17Z" clip-rule="evenodd" />
      </svg>
    {% endif %}
  </button>
</th>
