{# Column row in the management list. Swapped on create / rename. #}
<li id="column-row-{{ column.pk }}"
    class="flex items-center justify-between gap-2 px-1 py-2 border-b border-brand-light/60 last:border-b-0">
  <span class="font-medium text-brand-navy text-sm">{{ column.name }}</span>
  <span class="flex gap-1">
    <button class="btn btn-ghost btn-xs"
            hx-get="{% url 'tasks:column_update' project_pk=project.pk pk=column.pk %}"
            hx-target="#column-row-{{ column.pk }}"
            hx-swap="outerHTML">Rename</button>
    <button type="button"
            class="btn btn-outline btn-error btn-xs"
            onclick="document.getElementById('delete-column-modal-{{ column.pk }}').showModal()">
      Delete
    </button>
  </span>

  <dialog id="delete-column-modal-{{ column.pk }}" class="modal" aria-label="Delete column confirmation">
    <div class="modal-box max-w-xl bg-base-100 border border-error/40">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2" aria-label="Close">&times;</button>
      </form>
      <h2 class="text-lg font-semibold text-error">Delete &ldquo;{{ column.name }}&rdquo;?</h2>
      <p class="mt-3 text-brand-text">
        Are you sure you want to delete the column <strong>{{ column.name }}</strong>
        and all of its tasks? This action cannot be undone.
      </p>
      <div class="flex gap-2 justify-end mt-6">
        <button type="button" class="btn btn-ghost"
                onclick="document.getElementById('delete-column-modal-{{ column.pk }}').close()">
          Cancel
        </button>
        <button type="button" class="btn btn-outline btn-error"
                hx-post="{% url 'tasks:column_delete' project_pk=project.pk pk=column.pk %}"
                hx-target="#column-row-{{ column.pk }}"
                hx-swap="outerHTML swap:200ms"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                onclick="document.getElementById('delete-column-modal-{{ column.pk }}').close()">
          Delete column
        </button>
      </div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>
</li>
