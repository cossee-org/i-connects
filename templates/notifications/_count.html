{% comment %}
  The unread-count pill itself. Renders nothing at zero so every caller can
  drop it into a wrapper unconditionally.

  Callers pass ``unread_count``.
{% endcomment %}
{% if unread_count and unread_count > 0 %}<span class="text-[11px] font-semibold leading-none bg-brand-coral text-white rounded-full px-1.5 py-0.5 min-w-[1.25rem] inline-block text-center pointer-events-none">{% if unread_count > 99 %}99+{% else %}{{ unread_count }}{% endif %}</span>{% endif %}
