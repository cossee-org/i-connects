{% comment %}
  Modal fragment — loaded via HTMX into #email-modal-body from the email
  log's View email buttons. Wider than the plain modals, to fit an email.
{% endcomment %}
<div class="modal-box max-w-3xl">
  <h3 class="text-lg font-semibold text-brand-navy mb-4">Email</h3>
  {% include "communications/partials/email_content.html" %}
  <div class="flex justify-end mt-6">
    <button type="button" class="btn btn-ghost"
            onclick="document.getElementById('email-modal').close()">Close</button>
  </div>
</div>
<form method="dialog" class="modal-backdrop">
  <button>close</button>
</form>
