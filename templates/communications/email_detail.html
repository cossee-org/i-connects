{% extends "base.html" %}

{% block title %}Email &mdash; {{ project.name }}{% endblock %}

{% block page_header %}
  <header class="mb-6">
    {% include "_components/project_header.html" %}
  </header>
{% endblock %}

{% block content %}
<div class="flex flex-wrap items-center justify-between gap-3 mb-4">
  <a href="{% url 'communications:email_log' project_pk=project.pk %}"
     class="btn btn-sm btn-ghost text-brand-navy">&larr; Email log</a>
</div>
<div class="brand-card p-6 max-w-3xl">
  <h2 class="text-lg font-semibold text-brand-navy mb-4">Email</h2>
  {% include "communications/partials/email_content.html" %}
</div>
{% endblock %}
