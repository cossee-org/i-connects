{% extends "base.html" %}

{% block title %}Check your email &mdash; i-connects{% endblock %}

{% block content %}
<div class="flex justify-center">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl">Check your email</h1>
      <div class="alert alert-info">
        <span>
          If an account exists for the email you entered, a password reset
          link has been sent. The link expires in a few hours.
        </span>
      </div>
      <p class="text-sm mt-2 text-center">
        <a class="link" href="{% url 'accounts:login' %}">Back to sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
