{% extends "base.html" %}

{% block title %}Password reset &mdash; i-connects{% endblock %}

{% block content %}
<div class="flex justify-center">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-2xl">Password updated</h1>
      <div class="alert alert-success">
        <span>Your password has been reset and you are signed in.</span>
      </div>
      <div class="card-actions mt-2">
        <a href="/" class="btn btn-primary w-full">Continue</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
