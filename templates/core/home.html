{% extends "base.html" %}

{% block title %}i-connects &mdash; Django MVP{% endblock %}

{% block content %}
<section class="hero min-h-[60vh] bg-base-100 rounded-box shadow">
  <div class="hero-content text-center">
    <div class="max-w-xl">
      <h1 class="text-5xl font-bold">i-connects</h1>
      <p class="py-6 text-lg opacity-80">Django MVP rewrite</p>
