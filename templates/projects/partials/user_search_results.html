{# HTMX fragment — dropped into #user-search-results. #}
{% if users_data or q_is_email %}
  <ul class="border border-brand-light/60 rounded-lg overflow-hidden shadow-sm bg-base-100">
    {% for item in users_data %}
      <li class="border-b border-brand-light/60">
        <button type="button"
                class="w-full text-left px-3 py-2.5 text-sm text-brand-navy hover:bg-brand-lighter transition-colors"
                data-pk="{{ item.user.pk }}"
                data-label="{{ item.label }}"
                onclick="selectInviteUser(this.dataset.pk, this.dataset.label)">
          {{ item.label }}
        </button>
      </li>
    {% endfor %}
    {% if q_is_email %}
      <li>
        <button type="button"
                class="w-full text-left px-3 py-2.5 text-sm text-brand-navy hover:bg-brand-lighter transition-colors"
                data-email="{{ q }}"
                onclick="selectInviteEmail(this.dataset.email)">
          Invite <span class="font-medium">"{{ q }}"</span> by email
        </button>
      </li>
    {% endif %}
  </ul>
{% elif q %}
  <p class="text-sm text-brand-text/60 mt-1 px-1">No users found for "{{ q }}".</p>
{% endif %}
