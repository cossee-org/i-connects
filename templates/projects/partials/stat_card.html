{% comment %}
  One of the Project Summary's number cards: a count that opens its tab.
  Needs href, label, value; alert (optional) turns the number red while it
  is above zero, for counts that mean something is wrong (Overdue).
{% endcomment %}
<a href="{{ href }}"
   class="brand-card p-4 flex flex-col gap-1 transition-shadow hover:ring-1 hover:ring-brand-navy/20">
  <span class="text-xs font-medium uppercase tracking-wide text-brand-text/50">{{ label }}</span>
  <span class="text-3xl font-bold self-end {% if alert %}text-error{% else %}text-brand-navy{% endif %}">{{ value }}</span>
</a>
