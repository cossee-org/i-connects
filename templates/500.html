{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="iconnects">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong &mdash; i&bull;CONNECTS</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
</head>
<body class="min-h-screen flex flex-col bg-brand-lighter text-brand-text font-sans">
  <div class="brand-stripe" aria-hidden="true"></div>

  <main class="flex-1 flex items-center justify-center p-6" role="main">
    <div class="max-w-md w-full text-center">
      <div class="mx-auto w-14 h-14 rounded-full bg-error/10 flex items-center justify-center mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
             stroke-width="1.5" stroke="currentColor" class="w-7 h-7 text-error" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-brand-navy">Something went wrong</h1>
      <p class="mt-2 text-sm text-brand-text/80">
        The server hit an error processing that request. The incident has
        been logged. You can try again, go back, or head to the home page.
      </p>
      <div class="mt-6 flex gap-3 justify-center">
        <a href="/" class="btn bg-brand-coral hover:bg-brand-coral/90 text-white border-0 btn-sm">
          Back to home
        </a>
        <button type="button" onclick="history.back()" class="btn btn-ghost btn-sm">
          Try again
        </button>
      </div>
    </div>
  </main>
</body>
</html>
