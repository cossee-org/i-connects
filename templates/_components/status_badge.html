{# Status badge — {% include "_components/status_badge.html" with status=project.get_status_display %} #}
{% with s=status|lower %}
<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium
  {% if s == 'in progress' or s == 'in_progress' or s == 'active' or s == 'open' %}bg-success/10 text-success
  {% elif s == 'planning' %}bg-orange-100 text-orange-600
  {% elif s == 'paused' %}bg-purple-100 text-purple-600
  {% elif s == 'done' or s == 'completed' or s == 'closed' or s == 'archived' %}bg-brand-navy/10 text-brand-navy
  {% elif s == 'to do' or s == 'to-do' or s == 'todo' or s == 'pending' or s == 'new' or s == 'draft' %}bg-warning/10 text-warning
  {% elif s == 'overdue' or s == 'blocked' or s == 'error' %}bg-error/10 text-error
  {% elif s == 'inactive' %}bg-gray-100 text-gray-500
  {% else %}bg-brand-light/50 text-brand-text{% endif %}">
  {{ status }}
</span>
{% endwith %}
