{% comment %}
  Styling for rendered wiki markdown, the diff rows, and wiki links.

  Kept as a template-level <style> rather than as Tailwind utilities because
  the markup comes from the markdown renderer, not from a template: there is
  no element to hang a class on. The app also ships no typography plugin, so
  `prose` would be a no-op. Include this in `{% block extra_head %}` on any
  page that renders page text.
{% endcomment %}
<style>
  .wiki-prose { color: #333333; line-height: 1.7; }
  .wiki-prose > *:first-child { margin-top: 0; }
  .wiki-prose h1, .wiki-prose h2, .wiki-prose h3,
  .wiki-prose h4, .wiki-prose h5, .wiki-prose h6 {
    color: #323895; font-weight: 600; line-height: 1.3;
    margin: 1.75rem 0 0.6rem;
  }
  .wiki-prose h1 { font-size: 1.5rem; }
  .wiki-prose h2 {
    font-size: 1.25rem; padding-bottom: 0.3rem;
    border-bottom: 1px solid rgb(189 203 232 / 0.6);
  }
  .wiki-prose h3 { font-size: 1.1rem; }
  .wiki-prose h4, .wiki-prose h5, .wiki-prose h6 { font-size: 1rem; }
  .wiki-prose p { margin: 0.85rem 0; }
  .wiki-prose ul, .wiki-prose ol { margin: 0.85rem 0; padding-left: 1.5rem; }
  .wiki-prose ul { list-style: disc; }
  .wiki-prose ol { list-style: decimal; }
  .wiki-prose li { margin: 0.3rem 0; }
  .wiki-prose li > ul, .wiki-prose li > ol { margin: 0.3rem 0; }
  .wiki-prose a { color: #323895; text-decoration: underline; }
  .wiki-prose a:hover { color: #f03d30; }
  .wiki-prose code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.875em; background: #eaeff8; color: #231f20;
    padding: 0.1rem 0.3rem; border-radius: 4px;
  }
  .wiki-prose pre {
    background: #eaeff8; border: 1px solid rgb(189 203 232 / 0.6);
    border-radius: 8px; padding: 0.9rem 1rem; overflow-x: auto;
    margin: 1rem 0;
  }
  .wiki-prose pre code { background: none; padding: 0; font-size: 0.85rem; }
  .wiki-prose blockquote {
    border-left: 3px solid #bdcbe8; padding: 0.1rem 0 0.1rem 1rem;
    margin: 1rem 0; color: rgb(51 51 51 / 0.75);
  }
  .wiki-prose hr { border: 0; border-top: 1px solid rgb(189 203 232 / 0.6); margin: 1.75rem 0; }
  .wiki-prose table { border-collapse: collapse; margin: 1rem 0; display: block; overflow-x: auto; }
  .wiki-prose th, .wiki-prose td {
    border: 1px solid rgb(189 203 232 / 0.6); padding: 0.45rem 0.7rem; text-align: left;
  }
  .wiki-prose th { background: #eaeff8; color: #323895; font-weight: 600; }
  .wiki-prose img { max-width: 100%; height: auto; }

  {% comment %} A link to a page that does not exist yet reads as an invitation, not as an error. {% endcomment %}
  .wiki-link-missing { color: #f03d30 !important; text-decoration-style: dashed; }

  {% comment %} Contents list: python-markdown's toc extension emits a nested <ul>. {% endcomment %}
  .wiki-toc ul { list-style: none; margin: 0; padding-left: 0; }
  .wiki-toc ul ul { padding-left: 0.85rem; }
  .wiki-toc li { margin: 0.3rem 0; }
  .wiki-toc a {
    color: rgb(51 51 51 / 0.8); text-decoration: none; font-size: 0.8125rem;
    line-height: 1.4; display: block;
  }
  .wiki-toc a:hover { color: #f03d30; }

  .wiki-diff {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.8125rem; line-height: 1.6; overflow-x: auto;
  }
  .wiki-diff-row { display: block; white-space: pre-wrap; word-break: break-word; padding: 0 0.5rem; }
  .wiki-diff-added { background: rgb(22 163 74 / 0.1); color: #14532d; }
  .wiki-diff-removed { background: rgb(220 38 38 / 0.1); color: #7f1d1d; }
  .wiki-diff-hunk { color: rgb(51 51 51 / 0.5); padding-top: 0.4rem; }
  .wiki-diff-context { color: rgb(51 51 51 / 0.7); }
</style>
