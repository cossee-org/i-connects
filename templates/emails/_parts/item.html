{% comment %}One row of a "list" part: a title (a link when href is given) over a muted line of detail (the inner content).{% endcomment %}<tr><td style="padding:10px 0;border-top:1px solid #bdcbe8;font-size:15px;line-height:1.5;">{% if href %}<a href="{{ href }}" target="_blank" style="color:#323895;font-weight:600;text-decoration:none;">{{ title }}</a>{% else %}<span style="color:#323895;font-weight:600;">{{ title }}</span>{% endif %}{% if content %}<br><span style="font-size:13px;color:#5f6380;">{{ content }}</span>{% endif %}</td></tr>
