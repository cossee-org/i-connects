{% comment %}The one call to action in an email. link=True prints the URL under it, for emails whose link must work even when the button doesn't (account, invitation).{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:4px 0 20px;"><tr><td bgcolor="#d93226" style="background-color:#d93226;border-radius:6px;"><a href="{{ href }}" target="_blank" style="display:inline-block;padding:12px 22px;font-family:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.2;font-weight:600;color:#ffffff;text-decoration:none;border-radius:6px;">{{ content }}</a></td></tr></table>{% if link %}
<p style="margin:-8px 0 20px;font-size:13px;line-height:1.5;color:#5f6380;word-break:break-all;">Or paste this link into your browser:<br><a href="{{ href }}" target="_blank" style="color:#323895;">{{ href }}</a></p>{% endif %}
