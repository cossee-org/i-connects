{# Inline comment form. Submits to the comments:create HTMX endpoint. #}
<form class="mt-3 space-y-2"
      hx-post="{% url 'comments:create' task_pk=task.pk %}"
      hx-target="#task-comments"
      hx-swap="beforeend"
      hx-on::after-request="if(event.detail.successful) this.reset()">
  {% csrf_token %}
  <div class="w-full">
    <label for="{{ form.content.id_for_label }}" class="sr-only">Comment</label>
    {{ form.content }}
  </div>
  <div class="flex justify-end">
    <button type="submit"
            class="btn btn-sm bg-brand-coral hover:bg-brand-coral/90 text-white border-0">
      Comment
    </button>
  </div>
</form>
