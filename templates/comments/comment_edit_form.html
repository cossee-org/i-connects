{# Inline edit form for a comment. Swaps back to comment_item.html on save or cancel. #}
<div id="comment-{{ comment.pk }}" class="flex items-start gap-3">
  <div class="w-8 h-8 rounded-full bg-brand-navy text-white flex items-center justify-center text-sm font-semibold shrink-0" aria-hidden="true">
    <span>{{ comment.author.display_name|slice:":1"|upper }}</span>
  </div>
  <form class="flex-1 min-w-0 space-y-2"
        hx-post="{% url 'comments:edit' pk=comment.pk %}"
        hx-target="#comment-{{ comment.pk }}"
        hx-swap="outerHTML">
    {% csrf_token %}
    {{ form.content }}
    <div class="flex gap-2">
      <button type="submit"
              class="btn btn-sm bg-brand-coral hover:bg-brand-coral/90 text-white border-0">Save</button>
      <button type="button"
              class="btn btn-sm btn-ghost"
              hx-get="{% url 'comments:edit' pk=comment.pk %}?cancel=1"
              hx-target="#comment-{{ comment.pk }}"
              hx-swap="outerHTML">Cancel</button>
    </div>
  </form>
</div>
