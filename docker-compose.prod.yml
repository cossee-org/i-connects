# Production override. Use alongside docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires .env with DJANGO_SETTINGS_MODULE=config.settings.prod,
# DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS=<site domain>, POSTGRES_PASSWORD,
# DATABASE_URL, and REDIS_PASSWORD (mandatory -- see the redis service).
#
# The data volumes (postgres_data, media_data) are `external: true`: create
# them once per host with `docker volume create <name>` (DEPLOYMENT.md Part
# H). Compose then never creates *or deletes* them, so `down -v` cannot take
# the database with it.
#
# cossee-web-server already runs a host-level Caddy (systemd, not Docker)
# that owns :80/:443 for the whole machine -- see DEPLOYMENT.md Part G.
# This file has no caddy: service of its own; web is bound to loopback
# only and the host Caddy reverse-proxies to it.
#
# NOTE: Compose merges list fields (ports/expose/volumes) across `-f`
# files by union, not replacement -- a bare `[]` here does NOT clear what
# docker-compose.yml already set (see DEPLOYMENT.md Part A7). Every list
# override below uses `!reset`/`!override` to force an actual replacement;
# do not change these back to a bare `[]`. Map fields (healthcheck,
# depends_on, logging, environment) merge per key, which is relied on below.

# Cap container logs so an unbounded json-file log can't fill the host
# disk (DEPLOYMENT.md Part L).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    # scripts/start-web.sh: wait for Postgres, `migrate`, then `exec gunicorn`
    # so gunicorn -- not a shell -- is the process that receives SIGTERM
    # (graceful worker drain within --graceful-timeout; access log to
    # `docker compose logs web`, capped by the logging block below).
    # collectstatic is NOT part of start-up: it runs when the image is built.
    # Kept as a plain list on purpose: an earlier folded-YAML (`>`) multi-line
    # version preserved its line breaks, and the shell then ran gunicorn's
    # flags as separate commands (`sh: 3: --bind: not found`, exit 127).
    command: ["/app/scripts/start-web.sh", "gunicorn"]
    # Named volume, not `!reset []`: user-uploaded files under MEDIA_ROOT
    # (/app/media) must survive container recreation (redeploys, crashes,
    # `docker compose up -d --build`), which a plain image COPY does not.
    # NOTE: use `!override` here, not `!reset` -- `!reset` forces the field
    # empty/null regardless of what follows it; only `!override` actually
    # replaces the merged value with new content.
    volumes: !override
      - media_data:/app/media
    restart: unless-stopped
    # Loopback only: the host Caddy is the only thing that needs to reach
    # gunicorn. WEB_PORT is the *host* side; the container always listens on
    # 8000 (the health check probes 127.0.0.1:8000 inside the container and
    # is unaffected). On a shared host, "failed to bind host port
    # 127.0.0.1:8000: address already in use" means another process owns
    # it -- see DEPLOYMENT.md Part N -- and if it is another app, set
    # WEB_PORT in .env and point the Caddy site block at the same port.
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    logging: *default-logging
    # Same /healthz/ probe as the base file, but with the site's Host header:
    # prod ALLOWED_HOSTS is exactly the domain, so a bare `Host: localhost`
    # is a 400 (DisallowedHost) and the check could never pass -- which in
    # turn meant celery/celery-beat (gated on web being healthy) never
    # started. `$${...}` is Compose's escape; the container's shell expands
    # the first comma-separated entry of DJANGO_ALLOWED_HOSTS from env_file.
    # /healthz/ is exempt from SECURE_SSL_REDIRECT (prod.py), so this is a
    # real 200 from the view, not a 301 that `curl -f` would wave through.
    # start_period is generous because `migrate` runs first; a healthy
    # verdict is reported as soon as the first probe passes regardless.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $${DJANGO_ALLOWED_HOSTS%%,*}\" http://127.0.0.1:8000/healthz/ >/dev/null"]
      start_period: 90s
    # Plain-field limits, not `deploy.resources.limits` (that key only
    # takes effect under `docker stack deploy`/swarm, not `docker compose
    # up`). Caps a runaway/leaking process instead of it OOM-killing the
    # host; revisit these numbers after watching real usage.
    mem_limit: 1g
    cpus: 1.5

  celery:
    # Shares media_data with web -- cron.cleanup_tmp_files (cron/tasks.py)
    # and any future media-writing task run here, and must see the same
    # files web serves/receives. `!override`, not `!reset` -- see web's
    # volumes comment above.
    volumes: !override
      - media_data:/app/media
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g

  celery-beat:
    volumes: !reset []
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m

  db:
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    # Docker's default 64 MB /dev/shm is too small for Postgres's parallel
    # workers on larger queries ("could not resize shared memory segment").
    shm_size: 256m

  redis:
    ports: !reset []
    restart: unless-stopped
    logging: *default-logging
    # `${VAR:?msg}` makes Compose refuse to start with a clear error when
    # REDIS_PASSWORD is unset or empty. Before this guard an empty value
    # produced `--requirepass ""` (no password at all) together with a
    # health check that then failed authentication -- Redis sat unhealthy
    # forever and web/celery/celery-beat, all gated on it, never started.
    #
    # --appendonly: the queue is persisted to /data on every write (fsync
    # once a second) instead of the default hourly-ish RDB snapshot, so
    # queued emails survive a crash. --maxmemory-policy noeviction: a broker
    # must refuse writes when full rather than silently evict tasks.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env - see DEPLOYMENT.md Part F}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    # redis-cli reads REDISCLI_AUTH, so the health check authenticates
    # without `-a` (which warns on every run) and without the base file's
    # unauthenticated `ping`, which returns NOAUTH once --requirepass is on.
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env - see DEPLOYMENT.md Part F}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Above --maxmemory plus AOF rewrite headroom.
    mem_limit: 512m

volumes:
  # Data that must outlive everything, including `docker compose down -v`.
  # external: true means Compose never creates or removes these; create them
  # once per host with `docker volume create <name>` (DEPLOYMENT.md Part H).
  postgres_data:
    external: true
  media_data:
    name: i-connects_media_data
    external: true
  # Transient queue state: worth persisting across a crash, not worth
  # protecting from a deliberate wipe.
  redis_data:
    name: i-connects_redis_data
